<title>무선국 준수 대시보드</title>
<style>
  :root{
    color-scheme:light;
    --surface-1:#fcfcfb; --plane:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --delta-up:#006300;
    --chip-req:#2a78d6; --chip-cond:#eda100; --chip-na:#898781;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --surface-1:#1a1a19; --plane:#0d0d0d;
      --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
      --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
      --delta-up:#0ca30c;
      --chip-req:#3987e5; --chip-cond:#c98500; --chip-na:#898781;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
    --delta-up:#0ca30c;
    --chip-req:#3987e5; --chip-cond:#c98500; --chip-na:#898781;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--text-primary);
    font:400 14px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .viz-root{background:var(--plane);min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}

  header.page{margin-bottom:20px}
  h1{font-size:23px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--text-secondary);font-size:13.5px;margin:0}
  .srconly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .banner{border:1px solid var(--border);background:var(--surface-1);border-radius:10px;
    padding:14px 16px;margin:18px 0 22px;display:flex;gap:12px;align-items:flex-start}
  .banner .mark{flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--warning);margin-top:1px}
  .banner b{display:block;margin-bottom:3px;font-size:13.5px}
  .banner p{margin:0;color:var(--text-secondary);font-size:13px}

  nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:22px}
  nav.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;
    color:var(--text-secondary);padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button:hover{color:var(--text-primary)}
  nav.tabs button[aria-selected="true"]{color:var(--text-primary);font-weight:600;border-bottom-color:var(--series-1)}

  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;color:var(--text-muted);letter-spacing:.02em}
  select,.btn{font:inherit;font-size:13px;color:var(--text-primary);background:var(--surface-1);
    border:1px solid var(--border);border-radius:7px;padding:6px 10px;cursor:pointer}
  .btn[aria-pressed="true"]{border-color:var(--series-1);color:var(--series-1);font-weight:600}
  .seg{display:flex;gap:0}
  .seg .btn{border-radius:0;margin-left:-1px}
  .seg .btn:first-child{border-radius:7px 0 0 7px;margin-left:0}
  .seg .btn:last-child{border-radius:0 7px 7px 0}

  .grid{display:grid;gap:14px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
  .card h3{margin:0 0 2px;font-size:12.5px;font-weight:500;color:var(--text-secondary)}
  .card .val{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .card .unit{font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:3px}
  .card .meta{font-size:12px;color:var(--text-muted);margin-top:5px}
  .card .meta .up{color:var(--delta-up);font-weight:600}
  .card .meta .down{color:var(--critical);font-weight:600}
  .pending{color:var(--text-muted);font-size:19px;font-weight:500}

  .chartcard{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:18px 18px 12px}
  .chartcard > h2{margin:0 0 3px;font-size:15px;font-weight:600}
  .chartcard > .note{margin:0 0 14px;font-size:12.5px;color:var(--text-secondary)}
  .plot{position:relative;width:100%;overflow-x:auto}
  svg{display:block;max-width:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--text-secondary)}
  .legend li{display:flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}

  .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;z-index:20;
    background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    box-shadow:0 6px 22px rgba(0,0,0,.14);font-size:12.5px;min-width:130px}
  .tip b{display:block;margin-bottom:4px;font-size:12px;color:var(--text-secondary);font-weight:500}
  .tip .row{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-top:2px}
  .tip .row .k{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
  .tip .row .v{font-variant-numeric:tabular-nums;font-weight:600}

  details.tableview{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
  details.tableview summary{cursor:pointer;font-size:12.5px;color:var(--text-secondary);list-style:none}
  details.tableview summary::-webkit-details-marker{display:none}
  details.tableview summary::before{content:"표로 보기  ▸";}
  details.tableview[open] summary::before{content:"표로 보기  ▾";}
  .tblwrap{overflow-x:auto;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
  th{color:var(--text-secondary);font-weight:600;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:color-mix(in srgb,var(--series-1) 5%,transparent)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.req{color:var(--chip-req);border-color:color-mix(in srgb,var(--chip-req) 35%,transparent);
    background:color-mix(in srgb,var(--chip-req) 10%,transparent)}
  .chip.cond{color:var(--chip-cond);border-color:color-mix(in srgb,var(--chip-cond) 35%,transparent);
    background:color-mix(in srgb,var(--chip-cond) 12%,transparent)}
  .chip.na{color:var(--chip-na);border-color:color-mix(in srgb,var(--chip-na) 35%,transparent);
    background:color-mix(in srgb,var(--chip-na) 10%,transparent)}

  .matrix th.rot{font-size:11.5px;white-space:normal;min-width:78px;vertical-align:bottom}
  .matrix td.std{min-width:210px}
  .matrix td.std .nm{font-weight:600;display:block}
  .matrix td.std .ref{color:var(--text-muted);font-size:11.5px}
  .matrix td.c{text-align:center}
  .matrix td.c .qual{font-size:10.5px;color:var(--text-muted);margin-top:3px;line-height:1.3}
  .matrix th.rot{max-width:104px}
  .matrix tbody tr td:first-child{position:sticky;left:0;background:var(--surface-1)}

  .stack{display:grid;gap:18px}
  .prose h2{font-size:15px;margin:22px 0 6px}
  .prose h2:first-child{margin-top:0}
  .prose p,.prose li{color:var(--text-secondary);font-size:13.5px}
  .prose ul{padding-left:18px;margin:6px 0}
  .prose code{font-size:12.5px;background:color-mix(in srgb,var(--text-primary) 7%,transparent);
    padding:1px 5px;border-radius:4px}
  .prose a{color:var(--series-1)}
  .hidden{display:none}
  @media (max-width:640px){ .wrap{padding:20px 14px 56px} h1{font-size:19px} .card .val{font-size:22px} }
</style>

  box.appendChild(el("div",{class:"pending",text:"표시할 데이터가 없습니다."}));
  box.appendChild(el("div",{style:"color:var(--text-muted);font-size:12.5px;margin:6px 0 12px",
    text:"원자료가 아직 적재되지 않았습니다. 적재 절차는 '데이터 노트' 탭에 있습니다."}));
  if (state.profile !== "demo"){

    b.addEventListener("click",()=>{ state.profile="demo"; state.selected=[]; render(); });
    box.appendChild(b);
  }
  mount.appendChild(box);
}

/* 축 눈금을 1·2·2.5·5·10 계열의 '보기 좋은 수'로 맞춘다. */
function niceScale(lo, hi, targetTicks){
  if (hi === lo) hi = lo + 1;
  const rawStep = (hi - lo) / Math.max(1, targetTicks);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=> s >= rawStep) || 10*mag;
  return [Math.floor(lo/step)*step, Math.ceil(hi/step)*step, step];
}

/* ---------- chart: multi-line with crosshair ---------- */
function lineChart(mount, opt){
  const W = Math.max(560, mount.clientWidth || 640), H = opt.height || 300;
  const M = {t:14, r:18, b:34, l:opt.leftPad || 62};
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const ps = opt.periods, series = opt.series.filter(s => s.values.some(v => v != null));
  const flat = series.flatMap(s => s.values).filter(v => v != null);
  if (!ps.length || !series.length || !flat.length) { emptyState(mount); return; }
  const rawMax = Math.max(...flat), rawMin = Math.min(0, ...flat);
  const [min, max, step] = niceScale(rawMin, rawMax * 1.08 || 1, 4);
  const x = i => M.l + (ps.length === 1 ? iw/2 : i * iw/(ps.length-1));
  const y = v => M.t + ih - ((v - min)/(max - min)) * ih;

  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:"img",
    "aria-label":opt.ariaLabel || opt.title || "추이 차트"});
  for (let v = min; v <= max + step/2; v += step){
    const yy = y(v);
    svg.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:yy,y2:yy,stroke:cssVar("--grid"),"stroke-width":1}));
    svg.appendChild(el("text",{x:M.l-9,y:yy+4,"text-anchor":"end","font-size":11,
      fill:cssVar("--text-muted"),style:"font-variant-numeric:tabular-nums",
      text: opt.tickFmt ? opt.tickFmt(v) : Math.round(v).toLocaleString("ko-KR")}));
  }
  svg.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:M.t+ih,y2:M.t+ih,stroke:cssVar("--axis"),"stroke-width":1}));
  ps.forEach((p,i)=> svg.appendChild(el("text",{x:x(i),y:H-11,"text-anchor":"middle","font-size":11,
    fill:cssVar("--text-muted"),text:opt.xFmt ? opt.xFmt(p) : p})));

  const cross = el("line",{x1:0,x2:0,y1:M.t,y2:M.t+ih,stroke:cssVar("--axis"),"stroke-width":1,opacity:0});
  svg.appendChild(cross);

  series.forEach(s=>{
    const pts = s.values.map((v,i)=> v==null ? null : [x(i), y(v)]).filter(Boolean);
    if (pts.length > 1)
      svg.appendChild(el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L "),fill:"none",
        stroke:s.color,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"}));
    pts.forEach(p=>{
      svg.appendChild(el("circle",{cx:p[0],cy:p[1],r:4.5,fill:s.color,
        stroke:cssVar("--surface-1"),"stroke-width":2}));
    });
  });
  mount.appendChild(svg);

  const tip = el("div",{class:"tip"}); mount.appendChild(tip);
  svg.addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * (W / r.width);
    let idx = 0, best = Infinity;
    ps.forEach((_,i)=>{ const d = Math.abs(x(i)-sx); if (d<best){best=d;idx=i;} });
    cross.setAttribute("x1",x(idx)); cross.setAttribute("x2",x(idx)); cross.setAttribute("opacity",1);
    tip.innerHTML = "";
    tip.appendChild(el("b",{text: opt.xFmt ? opt.xFmt(ps[idx]) : ps[idx]}));
    series.forEach(s=>{
      tip.appendChild(el("div",{class:"row"},[
        el("span",{class:"k"},[el("span",{class:"swatch",style:"background:"+s.color}), el("span",{text:s.name})]),
        el("span",{class:"v",text: opt.valFmt ? opt.valFmt(s.values[idx]) : fmt(s.values[idx])})
      ]));
    });
    tip.style.opacity = 1;
    const px = x(idx) * (r.width / W);
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth/2, 0), r.width - tip.offsetWidth) + "px";
    tip.style.top = "6px";
  });
  svg.addEventListener("mouseleave", ()=>{ tip.style.opacity = 0; cross.setAttribute("opacity",0); });

  if (series.length >= 2) {
    const lg = el("ul",{class:"legend"});
    series.forEach(s=> lg.appendChild(el("li",{},[
      el("span",{class:"swatch",style:"background:"+s.color}), el("span",{text:s.name})])));
    mount.parentNode.insertBefore(lg, mount.nextSibling);
  }
}

/* ---------- chart: horizontal bars, single series ---------- */
function barChart(mount, rows, opt){
  const shown = rows.filter(r => r.value != null);
  if (!shown.length) { emptyState(mount); return; }
  const W = Math.max(560, mount.clientWidth || 640);
  // 막대 끝 직접 라벨이 잘리지 않도록, 가장 긴 라벨 폭만큼 오른쪽 여백을 확보한다.
  const labelPad = Math.max(...shown.map(r => opt.valFmt(r.value).length)) * 7.2 + 18;
  const rowH = 34, M = {t:6, r:Math.max(16, labelPad), b:6, l:opt.leftPad || 170};
  const H = M.t + M.b + shown.length * rowH;
  const iw = W - M.l - M.r;
  const max = Math.max(...shown.map(r=>r.value), 1);
  const color = cssVar("--series-1");
  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img","aria-label":opt.ariaLabel});
  const tip = el("div",{class:"tip"});

  shown.forEach((r,i)=>{
    const cy = M.t + i*rowH, bh = 16, by = cy + (rowH-bh)/2;
    const bw = Math.max(r.value === 0 ? 0 : 3, (r.value/max) * iw);
    svg.appendChild(el("text",{x:M.l-12,y:by+12,"text-anchor":"end","font-size":12.5,
      fill:cssVar("--text-secondary"),text:r.label}));
    if (bw > 0)
      svg.appendChild(el("rect",{x:M.l,y:by,width:bw,height:bh,rx:4,fill:color}));
    // 직접 라벨 — 밝은 대비 구제 규칙(relief rule) 충족
    svg.appendChild(el("text",{x:M.l+bw+8,y:by+12,"font-size":12,fill:cssVar("--text-primary"),
      style:"font-variant-numeric:tabular-nums",text:opt.valFmt(r.value)}));
    const hit = el("rect",{x:0,y:cy,width:W,height:rowH,fill:"transparent"});
    hit.addEventListener("mouseenter",()=>{
      tip.innerHTML="";
      tip.appendChild(el("b",{text:r.label}));
      tip.appendChild(el("div",{class:"row"},[
        el("span",{class:"k"},[el("span",{class:"swatch",style:"background:"+color}),
          el("span",{text:opt.metricLabel})]),
        el("span",{class:"v",text:opt.valFmt(r.value)})]));
      if (r.note) tip.appendChild(el("div",{class:"row"},[el("span",{class:"k",text:r.note})]));
      tip.style.opacity=1; tip.style.top=(cy*0.9)+"px"; tip.style.left="12px";
    });
    hit.addEventListener("mouseleave",()=>{ tip.style.opacity=0; });
    svg.appendChild(hit);
  });
  mount.appendChild(svg); mount.appendChild(tip);
}

/* ---------- table view ---------- */
function tableView(cols, rows, caption){
  const d = el("details",{class:"tableview"});
  d.appendChild(el("summary",{"aria-label":"표로 보기"}));
  const w = el("div",{class:"tblwrap"});
  const t = el("table");
  if (caption) t.appendChild(el("caption",{class:"srconly",text:caption}));
  t.appendChild(el("thead",{},[el("tr",{}, cols.map(c=>
    el("th",{class:c.num?"num":"",scope:"col",text:c.label})))]));
  t.appendChild(el("tbody",{}, rows.map(r=> el("tr",{}, r.map((cell,i)=>
    el("td",{class:cols[i].num?"num":"",text:String(cell)}))))));
  w.appendChild(t); d.appendChild(w);
  return d;
}

function chartCard(title, note, buildFn, tableEl){
  const card = el("div",{class:"chartcard"});
  card.appendChild(el("h2",{text:title}));
  if (note) card.appendChild(el("p",{class:"note",text:note}));
  const plot = el("div",{class:"plot"});
  card.appendChild(plot);
  requestAnimationFrame(()=> buildFn(plot));
  if (tableEl) card.appendChild(tableEl);
  return card;
}

/* ---------- panel: 개요 (국가 총계) ---------- */
// 국가 총계 계열 id <- 사업자 지표 키. 데모 모드에서 총계를 재구성할 때 쓴다.
const NAT_FROM_METRIC = {
  LIC_STATIONS_TOTAL:"licensedStations", LIC_NEW:"newLicenses",
  MON_TECH_VIOL:"techViolations", MON_LICENSE_VIOL:"licenseViolations",
  FEE_AMOUNT:"spectrumFeeKRW1k", INSP_STATIONS:"inspections"
};
function natSeries(id){
  const base = NAT.series.find(s=>s.id===id) || {id, label:id, values:{}};
  if (state.profile !== "demo") return base;
  const metric = NAT_FROM_METRIC[id];
  if (!metric) return {...base, values:{}};   // 데모에 대응 지표가 없는 계열은 비운다
  const values = {};
  PROFILES.demo.periods.forEach(pk=>{
    let sum = null;
    PROFILES.demo.carriers.forEach(c=>{
      const v = c.metrics[metric] ? c.metrics[metric][pk] : null;
      if (v != null) sum = (sum ?? 0) + v;
    });
    if (sum != null) values[pk] = sum;
  });
  return {...base, values};
}
function natYears(){
  if (state.profile === "demo") return PROFILES.demo.periods.filter(p=>!p.includes("-"));
  return NAT.periods.filter(p=>p.granularity==="YEAR").map(p=>p.key);
}

function renderOverview(){
  const host = $("#panel-overview"); host.innerHTML="";
  const ctrl = el("div",{class:"controls"});
  ctrl.appendChild(profileToggle());
  host.appendChild(ctrl);
  const years = natYears(), last = years[years.length-1], prev = years[years.length-2];

  const TILES = [
    {id:"LIC_STATIONS_TOTAL", unit:"국", better:"up"},
    {id:"MON_TECH_VIOL",      unit:"건", better:"down"},
    {id:"MON_LICENSE_VIOL",   unit:"건", better:"down"},
    {id:"FEE_AMOUNT",         unit:"",   better:"up", fee:true}
  ];
  const tiles = el("div",{class:"grid tiles"});
  TILES.forEach(t=>{
    const s = natSeries(t.id), cur = s.values[last], pre = s.values[prev];
    const card = el("div",{class:"card"});
    card.appendChild(el("h3",{text:s.label || t.id}));
    if (cur == null){
      card.appendChild(el("div",{class:"pending",text:"미수집"}));
      card.appendChild(el("div",{class:"meta",text:"원자료 적재 후 표시"}));
    } else {
      const v = el("div",{class:"val"});
      v.appendChild(document.createTextNode(t.fee ? fmt(cur,"spectrumFeeKRW1k") : cur.toLocaleString("ko-KR")));
      if (t.unit) v.appendChild(el("span",{class:"unit",text:" "+t.unit}));
      card.appendChild(v);
      const meta = el("div",{class:"meta"});
      if (pre != null && pre !== 0){
        const pct = ((cur-pre)/Math.abs(pre))*100;
        const rising = pct >= 0;
        const good = (t.better === "up") === rising;
        meta.appendChild(el("span",{class: good ? "up":"down",
          text:(rising?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"%"}));
        meta.appendChild(document.createTextNode("  전년 대비 ("+prev+"년)"));
      } else meta.textContent = last+"년 기준";
      card.appendChild(meta);
    }
    tiles.appendChild(card);
  });
  host.appendChild(tiles);

  const stack = el("div",{class:"stack",style:"margin-top:18px"});

  // 전파감시 적발 추이 — 두 계열 모두 단위가 '건'이라 단일 축으로 그린다(이중축 금지)
  const violIds = ["MON_TECH_VIOL","MON_LICENSE_VIOL","MON_ILLEGAL"];
  const violSeries = violIds.map((id,i)=>({
    name: natSeries(id).label || id, color: cssVar(SERIES_VARS[i]),
    values: years.map(y => natSeries(id).values[y] ?? null)
  }));
  stack.appendChild(chartCard(
    "전파감시 적발 실적 추이 (전국 총계)",
    "세 계열 모두 단위가 '건'이므로 하나의 축에 함께 그립니다. 근거: 「전파법」 제45조(기술기준), 제19조·제19조의2(허가·신고).",
    m => lineChart(m, {periods:years, series:violSeries, xFmt:y=>y+"년", valFmt:v=>fmt(v)+" 건", height:290}),
    tableView(
      [{label:"연도"},...violIds.map(id=>({label:natSeries(id).label||id, num:true}))],
      years.map(y=>[y+"년", ...violIds.map(id=> natSeries(id).values[y]!=null ? natSeries(id).values[y].toLocaleString("ko-KR") : "—")]),
      "전파감시 적발 실적 연도별 추이")
  ));

  // 전파사용료는 단위(천원)가 달라 별도 차트 — 이중축 대신 차트 분리
  const feeYears = years.map(y => natSeries("FEE_AMOUNT").values[y] ?? null);
  stack.appendChild(chartCard(
    "전파사용료 부과·징수액 추이 (전국 총계)",
    "단위가 다르므로 적발 건수와 축을 공유하지 않고 별도 차트로 분리했습니다. 근거: 「전파법」 제67조·제68조.",
    m => lineChart(m,{periods:years,
      series:[{name:"전파사용료", color:cssVar("--series-2"), values:feeYears}],
      xFmt:y=>y+"년", valFmt:v=>fmt(v,"spectrumFeeKRW1k"),
      tickFmt:v=> (v/100000).toFixed(0)+"억", leftPad:66, height:260}),
    tableView([{label:"연도"},{label:"전파사용료",num:true}],
      years.map((y,i)=>[y+"년", feeYears[i]!=null ? fmt(feeYears[i],"spectrumFeeKRW1k") : "—"]),
      "전파사용료 연도별 추이")
  ));
  host.appendChild(stack);
}

/* ---------- panel: 사업자 비교 ---------- */
function profileToggle(){
  const f = el("div",{class:"field"});
  f.appendChild(el("label",{text:"데이터 프로파일"}));
  const seg = el("div",{class:"seg"});
  [["official","공식(미수집)"],["demo","데모(합성)"]].forEach(([k,lab])=>{
    const b = el("button",{class:"btn",type:"button","aria-pressed":String(state.profile===k),text:lab});
    b.addEventListener("click",()=>{ state.profile=k; state.selected=[]; render(); });
    seg.appendChild(b);
  });
  f.appendChild(seg); return f;
}
function selectField(labelText, options, value, onChange){
  const f = el("div",{class:"field"});
  f.appendChild(el("label",{text:labelText}));
  const s = el("select");
  options.forEach(([v,l])=>{
    const o = el("option",{value:v,text:l});
    if (v===value) o.setAttribute("selected","selected");
    s.appendChild(o);
  });
  s.addEventListener("change",e=>onChange(e.target.value));
  f.appendChild(s); return f;
}

    el("td",{},[el("span",{style:"font-weight:600",text:ct.label}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:ct.examples.join(", ")})]),
    el("td",{},[el("span",{text:ct.openingRoute.route}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:ct.openingRoute.basis})]),
    el("td",{},[el("span",{text:ct.subscriberStationRoute.route}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:ct.subscriberStationRoute.basis})]),
    el("td",{},[el("span",{text:ct.spectrumFee.status}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:ct.spectrumFee.basis})]),
    el("td",{},[el("span",{text:ct.spectrumFee.assessment}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:ct.spectrumFee.assessmentBasis})])
  ]))));
  w.appendChild(t); legal.appendChild(w); host.appendChild(legal);
}

/* ---------- panel: 추이 ---------- */
function renderTrend(){
  const host = $("#panel-trend"); host.innerHTML="";
  const prof = activeProfile(), ps = periodsOf(prof);
  const yearKeys = ps.filter(p=>!p.includes("-"));
  const all = prof.carriers;
  if (!state.selected.length) state.selected = all.slice(0,3).map(c=>c.id);

  const ctrl = el("div",{class:"controls"});
  ctrl.appendChild(profileToggle());
  ctrl.appendChild(selectField("지표", Object.entries(METRIC_LABELS), state.trendMetric,
    v=>{ state.trendMetric=v; render(); }));
  host.appendChild(ctrl);

  const pick = el("div",{class:"controls",style:"gap:6px"});
  pick.appendChild(el("span",{style:"font-size:11.5px;color:var(--text-muted);align-self:center;margin-right:4px",
    text:"비교 사업자 (최대 6)"}));
  all.forEach(c=>{
    const on = state.selected.includes(c.id);
    const b = el("button",{class:"btn",type:"button","aria-pressed":String(on),text:c.label});
    b.addEventListener("click",()=>{
      if (on) state.selected = state.selected.filter(x=>x!==c.id);
      else if (state.selected.length < 6) state.selected = state.selected.concat(c.id);
      render();
    });
    pick.appendChild(b);
  });
  host.appendChild(pick);

  const chosen = all.filter(c=> state.selected.includes(c.id));
  const series = chosen.map((c,i)=>({
    name:c.label, color:cssVar(SERIES_VARS[i % SERIES_VARS.length]),
    values: yearKeys.map(y=> c.metrics[state.trendMetric] ? (c.metrics[state.trendMetric][y] ?? null) : null)
  }));
  const vf = v => fmt(v, state.trendMetric) + (unitOf(state.trendMetric) ? " "+unitOf(state.trendMetric) : "");

  host.appendChild(chartCard(
    METRIC_LABELS[state.trendMetric] + " — 사업자별 연도 추이",
    "선택한 사업자만 그립니다. 색은 사업자(개체)에 고정되어 있으므로 순위가 바뀌어도 색이 재배정되지 않습니다.",
    m => lineChart(m,{periods:yearKeys, series, xFmt:y=>y+"년", valFmt:vf,
      tickFmt: state.trendMetric==="spectrumFeeKRW1k" ? (v=>(v/100000).toFixed(0)+"억") : null,
      leftPad: state.trendMetric==="spectrumFeeKRW1k" ? 66 : 62, height:320}),
    tableView(
      [{label:"사업자"},...yearKeys.map(y=>({label:y+"년",num:true}))],
      chosen.map(c=>[c.label, ...yearKeys.map(y=>{
        const v = c.metrics[state.trendMetric] ? c.metrics[state.trendMetric][y] : null;
        return v!=null ? vf(v) : "미수집"; })]),
      METRIC_LABELS[state.trendMetric]+" 연도별 추이")
  ));

  // 증감률 표 — 연도 간 변화를 수치로 명시
  if (yearKeys.length >= 2){
    const card = el("div",{class:"chartcard",style:"margin-top:18px"});
    card.appendChild(el("h2",{text:"연도별 증감률"}));
    card.appendChild(el("p",{class:"note",text:"직전 연도 대비 변화율입니다. 분모가 0이거나 값이 없으면 '—'로 표시합니다."}));
    const w = el("div",{class:"tblwrap"}), t = el("table");
    t.appendChild(el("thead",{},[el("tr",{},[el("th",{scope:"col",text:"사업자"})]
      .concat(yearKeys.slice(1).map(y=> el("th",{class:"num",scope:"col",text:y+"년"}))))]));
    t.appendChild(el("tbody",{}, chosen.map(c=> el("tr",{},[el("td",{text:c.label})]
      .concat(yearKeys.slice(1).map((y,i)=>{
        const m = c.metrics[state.trendMetric] || {};
        const cur = m[y], pre = m[yearKeys[i]];
        if (cur==null || pre==null || pre===0) return el("td",{class:"num",text:"—"});
        const pct = ((cur-pre)/Math.abs(pre))*100;
        // 위반·적발 지표는 증가가 악화이므로 색의 방향을 뒤집는다.
        const good = (pct >= 0) === (BETTER[state.trendMetric] !== "down");
        return el("td",{class:"num",style:"color:"+(good?"var(--delta-up)":"var(--critical)"),
          text:(pct>=0?"+":"")+pct.toFixed(1)+"%"});
      }))))));
    w.appendChild(t); card.appendChild(w); host.appendChild(card);
  }
}

/* ---------- panel: 기술기준 매핑 ---------- */
const CHIP_CLASS = v => v === "해당없음" ? "na" : (v.startsWith("조건부") ? "cond" : "req");

function renderStandards(){
  const host = $("#panel-standards"); host.innerHTML="";
  const cats = ["전체"].concat([...new Set(TS.standards.map(s=>s.category))]);
  if (!state.stdCat) state.stdCat = "전체";
  if (!state.stdType) state.stdType = "전체";

  const ctrl = el("div",{class:"controls"});
  ctrl.appendChild(selectField("기준 분류", cats.map(c=>[c,c]), state.stdCat,
    v=>{ state.stdCat=v; render(); }));
  ctrl.appendChild(selectField("사업자 유형",
    [["전체","전체 유형 비교"]].concat(TS.carrierTypes.map(t=>[t.code,t.label])), state.stdType,
    v=>{ state.stdType=v; render(); }));
  host.appendChild(ctrl);

  const types = state.stdType==="전체" ? TS.carrierTypes : TS.carrierTypes.filter(t=>t.code===state.stdType);
  const stds = TS.standards.filter(s=> state.stdCat==="전체" || s.category===state.stdCat);

  const card = el("div",{class:"chartcard"});
  card.appendChild(el("h2",{text:"기술기준 항목 × 사업자 유형 적용 매핑표"}));
  card.appendChild(el("p",{class:"note",
    text:"각 셀은 색과 함께 '필수/조건부/해당없음' 문자를 항상 표기하므로 색만으로 의미를 구분하지 않습니다. 근거 조문은 항목명 아래에 병기했습니다."}));

  const lg = el("ul",{class:"legend"});
  [["필수","req"],["조건부","cond"],["해당없음","na"]].forEach(([lab,cls])=>
    lg.appendChild(el("li",{},[el("span",{class:"chip "+cls,text:lab}),
      el("span",{style:"color:var(--text-muted)",text:TS.applicabilityLegend[lab]})])));
  card.appendChild(lg);

  const w = el("div",{class:"tblwrap"}), t = el("table",{class:"matrix"});
  t.appendChild(el("thead",{},[el("tr",{},
    [el("th",{scope:"col",text:"기술기준 항목"}), el("th",{scope:"col",text:"측정 지표"})]
    .concat(types.map(ty=> el("th",{class:"rot",scope:"col",text:ty.shortLabel}))))]));
  t.appendChild(el("tbody",{}, stds.map(s=> el("tr",{},
    [ el("td",{class:"std"},[
        el("span",{class:"nm",text:s.name}),
        el("span",{class:"ref",text:s.legalRef + (s.annex && s.annex!=="-" ? " · "+s.annex : "")})]),
      el("td",{style:"color:var(--text-secondary);font-size:12px",text:s.measure})
    ].concat(types.map(ty=>{
      const v = s.applicability[ty.code] || "해당없음";
      // '필수(안테나공급전력)' 처럼 괄호가 붙은 값은 칩을 짧게 두고 단서는 아래 줄로 뺀다.
      const m = v.match(/^([^(]+)\((.+)\)$/);
      const base = m ? m[1].trim() : v, qualifier = m ? m[2].trim() : null;
      return el("td",{class:"c"},[
        el("span",{class:"chip "+CHIP_CLASS(v),text:base}),
        qualifier ? el("div",{class:"qual",text:qualifier}) : null
      ].filter(Boolean));
    }))))));
  w.appendChild(t); card.appendChild(w); host.appendChild(card);

  // 항목 상세
  const detail = el("div",{class:"chartcard",style:"margin-top:18px"});
  detail.appendChild(el("h2",{text:"기술기준 항목 상세 분류"}));
  detail.appendChild(el("p",{class:"note",text:"정의·위임 구조·위반 시 영향입니다. 조문은 법제처 국가법령정보 현행본 기준입니다."}));
  const dw = el("div",{class:"tblwrap"}), dt = el("table");
  dt.appendChild(el("thead",{},[el("tr",{},["ID","분류","항목","정의","위임 구조","위반 시 영향"]
    .map(h=> el("th",{scope:"col",text:h})))]));
  dt.appendChild(el("tbody",{}, stds.map(s=> el("tr",{},[
    el("td",{style:"color:var(--text-muted)",text:s.id}),
    el("td",{text:s.category}),
    el("td",{},[el("span",{style:"font-weight:600",text:s.name}),
                el("div",{style:"color:var(--text-muted);font-size:11.5px",text:s.legalRef})]),
    el("td",{style:"color:var(--text-secondary)",text:s.definition}),
    el("td",{style:"color:var(--text-secondary)",text:s.delegation}),
    el("td",{style:"color:var(--text-secondary)",text:s.violationImpact})
  ]))));
  dw.appendChild(dt); detail.appendChild(dw); host.appendChild(detail);
}

/* ---------- panel: 데이터 노트 ---------- */
function renderNotes(){
  const host = $("#panel-notes");
  if (host.dataset.done) return;
  host.dataset.done = "1";
  const d = NAT.dataset;
  host.innerHTML = `
  <div class="chartcard prose">
    <h2>1. 원자료</h2>
    <ul>
      <li><b>${d.title}</b> — ${d.orgName} ${d.deptName}</li>
      <li>공공데이터포털 목록번호 ${d.recordId} · 형식 ${d.format} · 갱신주기 ${d.updateCycle} · 최종수정 ${d.modifiedDate}</li>
      <li>이용허락범위: ${d.license} · 최신 파일: ${d.latestFile}</li>
      <li>포털: <a href="${d.portalUrl}" target="_blank" rel="noopener">${d.portalUrl}</a></li>
      <li>기관 주석: ${d.note}</li>
    </ul>

    <h2>2. 이 대시보드가 사업자별 수치를 비워 두는 이유</h2>
    <p>전파관리통계는 <b>전국 총계 ${d.rowCount}행 × 기간 ${d.columnCount - 1}열</b>의 가로형 표입니다.
    '구분' 축은 무선국 종류·업무 유형으로 나뉘며, <b>사업자(법인) 축은 존재하지 않습니다</b>.
    따라서 이 통계만으로는 특정 사업자의 허가 건수·기술기준 위반 건수·전파사용료 납부액을 분해할 수 없습니다.
    실존 사업자 이름에 근거 없는 수치를 붙이지 않기 위해, 공식 프로파일에서는 해당 값을 '미수집'으로 두고
    데모 프로파일에서는 익명 라벨과 합성값만 사용합니다.</p>

    <h2>3. 사업자별 수치를 채우는 경로</h2>
    <ul>
      <li>과학기술정보통신부·중앙전파관리소 <b>정보공개청구</b> 회신(사업자별 무선국·검사·위반 내역)</li>
      <li>국회 과학기술정보방송통신위원회 <b>국정감사 요구자료</b>(사업자별 전파사용료 납부액)</li>
      <li>각 사업자 <b>사업보고서·감사보고서</b>상 전파사용료 계상액</li>
      <li>「전파법」 제19조제3항에 따라 전기통신사업자가 통보한 <b>가입자 수</b></li>
    </ul>
    <p>수치를 채울 때는 <code>data/carrier_metrics.json</code>의 <code>basis</code> 필드에
    OFFICIAL(원자료 그대로) · DERIVED(공표 총계로 산술 도출) · ESTIMATED(안분 추정) 중 하나를 반드시 표기하십시오.
    안분 추정값에는 배분식과 근거 지표를 함께 남겨야 합니다.</p>

    <h2>4. 적재 절차</h2>
    <ul>
      <li>포털에서 CSV를 내려받습니다.</li>
      <li><code>python3 scripts/ingest_rrb_csv.py &lt;내려받은.csv&gt;</code> 실행 — 국가 총계가 정규화되어 적재됩니다.</li>
      <li><code>python3 scripts/build_dashboard.py</code> 실행 — 데이터가 인라인된 <code>index.html</code>이 다시 생성됩니다.</li>
      <li>매핑되지 않은 '구분' 행은 버려지지 않고 <code>unmappedSeries</code>에 원문 그대로 보존되며 경고가 출력됩니다.</li>
    </ul>

    <h2>5. 법령 근거</h2>
    <ul>
      <li>「전파법」(법률, 법령ID ${TS.legalBasis.parentAct.lawId}) — 공포 ${TS.legalBasis.parentAct.promulgated} · 시행 ${TS.legalBasis.parentAct.effective}</li>
      <li>「무선설비규칙」(${TS.legalBasis.technicalRule.issuer}, 법령ID ${TS.legalBasis.technicalRule.lawId}) — 공포 ${TS.legalBasis.technicalRule.promulgated} · 시행 ${TS.legalBasis.technicalRule.effective}</li>
      <li>조회 경로: ${TS.legalBasis.retrievedVia} · 조회일 ${TS.legalBasis.retrievedAt}</li>

    <p>구체적 수치 기준(허용편차 값, 불요발사 허용치 등)은 무선설비규칙 <b>별표 1~6</b> 및
    과학기술정보통신부 고시에 규정되어 있습니다. 이 대시보드는 별표의 수치를 직접 옮겨 싣지 않고
    <b>항목·근거 조문·측정 지표·적용 대상</b>까지만 정리합니다. 별표 수치는 개정이 잦아, 판단에 쓸 때에는
    반드시 조회 시점의 현행 별표를 확인해야 합니다.</p>

    <h2>6. 알려진 한계</h2>
    <ul>
      <li>전파감시 '기술기준위반' 집계는 적발 건수이며, 위반의 <b>중대성·조치 결과</b>를 구분하지 않습니다.</li>
      <li>이동통신 가입자 단말은 「전파법」 제19조제2항에 따라 <b>허가의제</b>되어 검사·변경허가 대상에서 제외되므로,
      무선국 국수 추이는 설비 규모가 아니라 <b>가입자 수 변동</b>을 크게 반영합니다.</li>
      <li>「전파법」 제67조제1항제3호에 따라 허가의제 무선국은 전파사용료가 <b>전부 면제</b>되므로,
      '무선국 수가 많으면 사용료도 많다'는 해석은 성립하지 않습니다.</li>
      <li>기간통신사업자의 전파사용료는 제68조제1항 단서에 따라 <b>가입자 수 기준</b>으로 산정될 수 있어,
      기지국 수 기반 안분 추정은 체계적 편향을 낳습니다.</li>
      <li>포털 목록 메타데이터 기반 항목명은 원본 CSV의 실제 '구분' 문자열과 다를 수 있으며, 적재 시 원본 라벨이 정본입니다.</li>
    </ul>
  </div>`;
}

/* ---------- tabs & boot ---------- */
const TABS = [
  ["overview","개요 (전국 총계)"],
  ["carriers","사업자 비교"],
  ["trend","연도별 추이"],
  ["standards","기술기준 매핑표"],
  ["notes","데이터 노트"]
];
function renderTabs(){
  const nav = $("#tabs"); nav.innerHTML="";
  TABS.forEach(([k,lab])=>{
    const b = el("button",{type:"button",role:"tab","aria-selected":String(state.tab===k),
      "aria-controls":"panel-"+k,text:lab});
    b.addEventListener("click",()=>{ state.tab=k; render(); });
    nav.appendChild(b);
  });
  TABS.forEach(([k])=> $("#panel-"+k).classList.toggle("hidden", state.tab!==k));
}
function render(){
  renderTabs(); renderBanner();
  if (state.tab==="overview")  renderOverview();
  if (state.tab==="carriers")  renderCarriers();
  if (state.tab==="trend")     renderTrend();
  if (state.tab==="standards") renderStandards();
  if (state.tab==="notes")     renderNotes();
}
render();
let rz; addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(render,180); });
})();
